[project]
name = "pantry-api"
version = "0.1.0"
description = "Backend API for the pantry management app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.114",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,s3]>=5.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
