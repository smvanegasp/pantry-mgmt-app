<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6f2" />
    <title>Pantry</title>
    <!-- App icon and "Add to Home Screen". The manifest is .json so S3 serves it as JSON. -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Nunito: the rounded font of the sakura theme (index.css --font-sans). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="Pantry" />
    <script>
      // Apply dark mode before the first paint (no white flash). Same logic as src/lib/theme.ts:
      // light by default; only an explicit Dark from the old key carries over.
      try {
        var t = localStorage.getItem("pantry.appearance");
        if (t !== "system" && t !== "light" && t !== "dark") {
          t = localStorage.getItem("pantry.theme") === "dark" ? "dark" : "light";
        }
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#14162a");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
