# Local development stack. Open http://localhost:5173 (or tunnel it with ngrok).
services:
  api:
    build:
      context: ./backend
      target: app
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app:/app/app
    # PASSCODE_HASH and SESSION_SECRET, written by scripts/set_passcode.py (git-ignored).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Plain http on localhost; ngrok and AWS serve https.
      COOKIE_SECURE: "0"
      # Recording tutorials and testing start many demos from one machine.
      SANDBOX_LIMIT_PER_IP: "1000"
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      TABLE_NAME: pantry
      AUTO_CREATE_TABLE: "1"
      AWS_REGION: us-east-1
      # DynamoDB Local accepts any credentials.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      # Docker on Windows doesn't forward file-change events; poll for --reload.
      WATCHFILES_FORCE_POLLING: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - dynamodb

  dynamodb:
    image: amazon/dynamodb-local:latest
    # Root so it can write to the named volume.
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    volumes:
      - dynamodb_data:/data
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
      - web_node_modules:/web/node_modules
    environment:
      API_URL: http://api:8080
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev"
    depends_on:
      - api

volumes:
  dynamodb_data:
  web_node_modules:
