# Local development stack. Open http://localhost:5173 (or tunnel it with ngrok).
services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  web:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
      - web_node_modules:/web/node_modules
    environment:
      API_URL: http://api:8080
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev"
    depends_on:
      - api

volumes:
  web_node_modules:
