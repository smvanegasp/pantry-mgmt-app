# One grouped pull request per ecosystem each week. CI runs on each; merging deploys.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    groups: { docker: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: terraform
    directory: /infra
    schedule: { interval: weekly }
    groups: { terraform: { patterns: ["*"] } }
